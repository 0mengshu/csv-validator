[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "data-check"
description = "用 JSON 规则校验 CSV 数据的命令行工具 (Validate CSV data against JSON rules)"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["csv", "validation", "data-quality", "checker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dynamic = ["version"]

# 命令行工具零依赖；GUI 通过额外依赖安装: pip install "data-check[gui]"
[project.optional-dependencies]
gui = ["matplotlib>=3.5"]

[project.scripts]
data-check = "data_check:main"
data-check-gui = "gui:main"

[tool.setuptools]
py-modules = ["data_check", "gui"]

[tool.setuptools.dynamic]
version = { attr = "data_check.__version__" }
